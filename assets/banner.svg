<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Terminal: Luan Gomes, Web and Mobile Developer, São Paulo, Brazil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="62" y="84" height="30" width="0">
        <animate attributeName="width"
                 values="0;11;22;33;44;55;66"
                 keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1"
                 calcMode="discrete" dur="0.9s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; font-size: 18px; }
    .dim   { fill: #8b949e; }
    .key   { fill: #58a6ff; }
    .val   { fill: #e6edf3; }
    .green { fill: #3fb950; }
    .purple{ fill: #bc8cf5; }
    .title { font-size: 12px; fill: #8b949e; }
    .line  { opacity: 0; animation: fadeIn .5s ease-out forwards; }
    .l1 { animation-delay: 1.5s; }
    .l2 { animation-delay: 2.0s; }
    .l3 { animation-delay: 2.5s; }
    .l4 { animation-delay: 3.0s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="896" height="276" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="40" rx="14" fill="#161b22"/>
  <rect x="2" y="28" width="896" height="14" fill="#161b22"/>
  <line x1="2" y1="42" x2="898" y2="42" stroke="#30363d"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="26" text-anchor="middle" class="title">luan@sao-paulo: ~</text>

  <!-- command -->
  <text x="34" y="106" class="green">$</text>
  <text x="62" y="106" class="val" clip-path="url(#typeClip)">whoami</text>

  <!-- output -->
  <g class="line l1">
    <text x="34" y="150" class="purple">▸</text>
    <text x="62" y="150" class="key">name</text>
    <text x="170" y="150" class="dim">=</text>
    <text x="196" y="150" class="val">"Luan Gomes"</text>
  </g>
  <g class="line l2">
    <text x="34" y="182" class="purple">▸</text>
    <text x="62" y="182" class="key">role</text>
    <text x="170" y="182" class="dim">=</text>
    <text x="196" y="182" class="val">"Web | Mobile Developer"</text>
  </g>
  <g class="line l3">
    <text x="34" y="214" class="purple">▸</text>
    <text x="62" y="214" class="key">location</text>
    <text x="170" y="214" class="dim">=</text>
    <text x="196" y="214" class="val">"São Paulo, Brazil"</text>
  </g>
  <g class="line l4">
    <text x="34" y="246" class="purple">▸</text>
    <text x="62" y="246" class="key">status</text>
    <text x="170" y="246" class="dim">=</text>
    <text x="196" y="246" class="val">"learning, building, repeating"</text>
    <rect class="cursor" x="538" y="231" width="10" height="20" fill="url(#accent)"/>
  </g>
</svg>
